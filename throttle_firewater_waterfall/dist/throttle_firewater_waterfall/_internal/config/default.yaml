serial:
  baudrate: 115200
  bytesize: 8
  parity: N
  stopbits: 1
  timeout: 0.02

protocol:
  name: firewater
  encoding: ascii
  max_line_length: 4096
  ignore_image_packet: true
  allow_unknown_prefix: true
  missing_field_policy: fill_none
  extra_field_policy: auto_name

channel_mapping:
  active_profile: default_imu
  gui_editable: true
  require_gui_configuration: true
  auto_open_wizard_if_invalid: true
  allow_unknown_prefix: true
  extra_field_policy: auto_name
  missing_field_policy: fill_none

  profiles:
    default_imu:
      name: default_imu
      description: "默认模板：完整 IMU + 油门。用户可在 GUI 中修改。"
      mappings:
        imu:
          prefix: imu
          display_name: "IMU 数据"
          enabled: true
          unknown_field_policy: auto_name
          missing_field_policy: fill_none
          fields:
            - index: 0
              name: ax
              role: imu_acc
              unit: g
              enabled: true
              scale: 1.0
              offset: 0.0
              decimals: 3
              min_value: -16
              max_value: 16
              out_of_range_policy: warn
              note: ""

            - index: 1
              name: ay
              role: imu_acc
              unit: g
              enabled: true
              scale: 1.0
              offset: 0.0
              decimals: 3
              min_value: -16
              max_value: 16
              out_of_range_policy: warn
              note: ""

            - index: 2
              name: az
              role: imu_acc
              unit: g
              enabled: true
              scale: 1.0
              offset: 0.0
              decimals: 3
              min_value: -16
              max_value: 16
              out_of_range_policy: warn
              note: ""

            - index: 3
              name: gx
              role: imu_gyro
              unit: dps
              enabled: true
              scale: 1.0
              offset: 0.0
              decimals: 3
              min_value: -2000
              max_value: 2000
              out_of_range_policy: warn
              note: ""

            - index: 4
              name: gy
              role: imu_gyro
              unit: dps
              enabled: true
              scale: 1.0
              offset: 0.0
              decimals: 3
              min_value: -2000
              max_value: 2000
              out_of_range_policy: warn
              note: ""

            - index: 5
              name: gz
              role: fft_primary
              unit: dps
              enabled: true
              scale: 1.0
              offset: 0.0
              decimals: 3
              min_value: -2000
              max_value: 2000
              out_of_range_policy: warn
              note: ""

            - index: 6
              name: throttle
              role: throttle
              unit: "%"
              enabled: true
              scale: 1.0
              offset: 0.0
              decimals: 1
              min_value: 0
              max_value: 100
              out_of_range_policy: clamp
              note: ""

      throttle:
        channel: throttle
        unit: "%"
        normalize: true
        input_min: 0
        input_max: 100
        output_min: 0
        output_max: 100
        reverse: false
        deadband: 0
        smoothing_alpha: 0.2
        timeout_sec: 1.0
        out_of_range_policy: clamp

      fft_channels:
        primary: gz
        optional:
          - gx
          - gy
          - ax
          - ay
          - az

acquisition:
  sample_rate_mode: manual
  sample_rate: 1000
  throttle_min: 0
  throttle_max: 100

preprocess:
  dc_enabled: true
  dc_mode: window_mean
  apply_to_roles:
    - vibration
    - fft_primary
    - fft_optional
    - imu_gyro
    - imu_acc
  apply_channels: []
  ema_alpha: 0.01
  running_mean_window_sec: 2.0
  highpass_cutoff_hz: 1.0
  highpass_order: 2
  sample_rate: 1000
  detrend_enabled: false
  fft_remove_window_mean: true
  replace_nan_with_last: true
  clamp_outliers: false

dc_warning:
  enabled: true
  threshold_abs: 5.0
  threshold_ratio: 0.5

fft:
  window_size: 1024
  overlap: 0.5
  window: hann
  remove_dc: true
  detrend: false
  freq_min: 0
  freq_max: 500
  ignore_below_hz: 2
  db_floor: -120

filter:
  enabled: false
  type: bandpass
  lowcut: 5
  highcut: 500
  order: 4

waterfall:
  mode: throttle
  throttle_bin_size: 2
  time_rows: 300
  db_min: -90
  db_max: -20
  colormap: turbo
  aggregation: ema
  ema_alpha: 0.2
  min_count_per_bin: 3
  display_freq_min: 2

peak:
  enabled: true
  ignore_below_hz: 5
  top_n: 5
  min_prominence_db: 6

ui:
  refresh_fps: 25
  theme: dark

simulator:
  enabled: false
  output_prefix: imu
  sample_rate: 1000
  throttle_period_sec: 20
  motor_base_hz: 20
  motor_gain_hz_per_percent: 3
  frame_resonance_hz: 85
  vacuum_hz: 145
  noise_std: 0.05
  dc_offset_gz: 10.0
